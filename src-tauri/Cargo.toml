[package]
name = "xkg-desktop"
version = "0.1.0"
description = "XKG Desktop — global shortcut capture for the X Knowledge Graph"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xkg_desktop"
path = "src/lib.rs"

[[bin]]
name = "xkg-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
# TASK-203 (CS-X1): HKDF-SHA256 to derive the cross-platform device
# key. Must use the same salt/info/output-length as the mobile side
# (xkg-mobile-flutter lib/sync/sync_crypto.dart SyncCrypto.hkdfKey).
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
chrono = "0.4"
xkg-core = { path = "/home/x2/.openclaw/workspace/xkg-core" }
url = "2.5"
# Phase 5a: URL-encode conversation titles for the "Continue in browser"
# deep-link (e.g. `?q=hello%20world`). `urlencoding` is the no-deps
# percent-encoder we use for that — no need to pull in a bigger crate.
urlencoding = "2.1"
# Sync command deps (Phase 4): ULID for device_id, sha2 for derive_key,
# hex for the local token digest.
ulid = "1.1"
sha2 = "0.10"
hex = "0.4"
# TASK-203: Store the device encryption key in the OS keyring
# (Keychain on macOS, Secret Service on Linux, Credential Manager on
# Windows) instead of deriving it from the on-disk DB path. Addresses
# audit finding CS-X3.
keyring = "2"
# Cryptographically secure RNG used to mint a fresh 32-byte device
# key on first launch. Tiny dep (~no transitive cost) and cross-
# platform (uses BCryptGenRandom on Windows, getrandom(2) on Linux,
# SecRandomCopyBytes on macOS).
getrandom = "0.2"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.10"
# In-test mock HTTP transport for the sync round-trip test.
httpmock = "0.7"

# v0.8.0 bloat reduction (TASK-176): strip + LTO + panic=abort
# brings AppImage from 77MB → ~25MB
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
incremental = false
