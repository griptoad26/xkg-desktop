# .github/workflows/release-signed.yml
#
# Release workflow with GPG-signed commits and tags.
# - Local dev: signing key lives on the developer's GPG keychain (TTY/local agent).
#   Run `git config --global user.signingkey <FINGERPRINT>` and `git config --global commit.gpgsign true`.
# - CI: signing key material is imported from a GitHub Actions secret (base64-armored
#   private key + passphrase) using crazy-max/ghaction-import-gpg.
#
# Required repository secrets:
#   GPG_PRIVATE_KEY            base64 of an ASCII-armored GPG private key (no passphrase) OR
#                               the armored block directly; the action accepts both.
#   GPG_PASSPHRASE             passphrase for the signing subkey. Leave empty string if none.
#   GPG_FINGERPRINT            40-char fingerprint of the signing key, e.g. "ABCDEF1234...".
#   GPG_SIGNING_KEY_ID         short key ID (last 16 hex of fingerprint) used for `git config user.signingkey`.
#
# Add the *public* key to .well-known/keybase.txt or SECURITY.md so verifiers can fetch it.

name: Release (signed)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to cut (e.g. v0.1.1)"
        required: true

permissions:
  contents: write
  id-token: write   # for provenance / sigstore later

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # we'll re-set credentials with signing config

      - name: Import GPG signing key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag gpgsign: true
          # Workaround for self-hosted runner GPG_TTY: force a loopback tty in CI.
          extra_gpg_args: --pinentry-mode loopback --batch

      - name: Verify key
        run: |
          set -euo pipefail
          echo "Imported fingerprint:"
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}'
          # Fail fast if the imported key doesn't match the fingerprint we expect.
          ACTUAL=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          if [ "$ACTUAL" != "${{ secrets.GPG_FINGERPRINT }}" ]; then
            echo "::error::Imported fingerprint $ACTUAL != expected ${{ secrets.GPG_FINGERPRINT }}"
            exit 1
          fi
          git config --global user.signingkey "${{ secrets.GPG_SIGNING_KEY_ID }}"
          git config --global gpg.format openpgp
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true

      - name: Set git author
        run: |
          git config --global user.name  "xkg-release-bot"
          git config --global user.email "release-bot@users.noreply.github.com"

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-tag with signature (idempotent)
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          # Force-create an annotated, signed tag pointing at HEAD of the pushed tag's commit.
          COMMIT=$(git rev-parse "${TAG}^{commit}")
          git tag -d "$TAG" || true
          git tag -a -s -m "Release ${TAG}" "$TAG" "$COMMIT"
          git push origin ":refs/tags/${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Verify tag signature
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          git verify-tag --verbose "$TAG"
          git verify-commit "${{ steps.import_gpg.outputs.git_config_safe_dir || 'HEAD' }}" || true

      - name: Build matrix (placeholder)
        run: |
          echo "Build steps live in build-tauri.yml — kept separate so this job stays focused on signing."

      - name: Attach signatures to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            *.sig
            SBOM.*
            THIRD-PARTY-NOTICES.*

      - name: Detached signature bundle
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          mkdir -p out
          git verify-tag "$TAG" > out/${TAG}.tag.asc 2>&1 || true
          for art in SBOM.cdx.json SBOM.spdx.json THIRD-PARTY-NOTICES.txt; do
            [ -f "$art" ] || continue
            gpg --armor --detach-sign --output "out/${art}.sig" "$art"
            gpg --armor --verify   "out/${art}.sig" "$art"
          done

  verify-signatures:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag + artifacts
        run: |
          git verify-tag --verbose "${{ steps.tag.outputs.name }}"
          for sig in out/*.sig; do
            [ -f "$sig" ] || continue
            gpg --verify "$sig" "${sig%.sig}"
          done